            <h1 class="shadow">
                The current time is <span id="datetime"></span>
                <noscript>Javascript is disabled, enable Javascript to enable extra features on this webpage</noscript>
                <script>
                    // Function to update the date and time
                    function updateDateTime() {
                        const now = new Date();
                        const currentDateTime = now.toLocaleString();
                        document.querySelector("#datetime").textContent = currentDateTime;
                    }

                    // Call the updateDateTime function every second
                    setInterval(updateDateTime, 1000);
                    
                    function calculateExactTimeElapsed() {
                        // FIX: Updated target ID to match the HTML span below
                        const timeBox = document.getElementById("time-elapsed");
                        if (!timeBox) return;

                        // Set the precise start date and time (June 18, 2009, at 6:30 PM)
                        const pastDate = new Date("2009-06-18T18:30:00");
                        const nowDate = new Date();

                        // 1. Calculate the rough difference in years
                        let years = nowDate.getFullYear() - pastDate.getFullYear();

                        // 2. Adjust years if the current time hasn't reached 6:30 PM on June 18th yet this year
                        const currentAnniversary = new Date(
                            nowDate.getFullYear(), 
                            pastDate.getMonth(), 
                            pastDate.getDate(),
                            pastDate.getHours(),
                            pastDate.getMinutes()
                        );
                        if (nowDate < currentAnniversary) {
                            years--;
                        }

                        // 3. Find the most recent exact anniversary date and time
                        const lastAnniversary = new Date(
                            pastDate.getFullYear() + years, 
                            pastDate.getMonth(), 
                            pastDate.getDate(),
                            pastDate.getHours(),
                            pastDate.getMinutes()
                        );

                        // 4. Calculate the total remaining milliseconds since the last anniversary
                        let msDifference = nowDate - lastAnniversary;

                        // 5. Break down the remaining milliseconds into precise days, hours, and minutes
                        const msPerDay = 1000 * 60 * 60 * 24;
                        const msPerHour = 1000 * 60 * 60;
                        const msPerMinute = 1000 * 60;

                        const days = Math.floor(msDifference / msPerDay);
                        msDifference %= msPerDay; 

                        const hours = Math.floor(msDifference / msPerHour);
                        msDifference %= msPerHour; 

                        const minutes = Math.floor(msDifference / msPerMinute);

                        // 6. Output the precise result layout
                        timeBox.innerHTML = `${years} years, ${days} days, ${hours} hours, and ${minutes} minutes`;
                    }

                    // Run the calculation immediately, then update it live every minute
                    function initAgeTracker() {
                        calculateExactTimeElapsed();
                        setInterval(calculateExactTimeElapsed, 60000);
                    }

                    // Safely initializes the script after your existing HTML finishes loading
                    if (document.readyState === "loading") {
                        document.addEventListener("DOMContentLoaded", initAgeTracker);
                    } else {
                        initAgeTracker();
                    }
                </script>
            </h1>
