<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- 1. TOP BANNER: Real-time clock output -->
    <div class="TOP">
        <div class="top-content">
            The current time is&nbsp;<span id="datetime"></span>
        </div>
    </div>

    <!-- 2. MIDDLE AREA: Real-time exact age calculation output -->
    <div class="MIDDLE">
        <div class="middle-content">
            <h1 class="WELCOME-TEXT">welcome</h1>
            <p class="bio-text">
                Welcome to my webpage! My name is Conor McCarthy, I'm <span id="time-elapsed" class="bold-highlight"></span> old. To learn more about this website and more about me click the links on the bottom of the page
            </p>
        </div>
    </div>

    <!-- 3. BOTTOM BANNER: Authentic Windows XP Navigation Links -->
    <div class="BOTTOM">
        <div class="bottom-content">
            <nav class="xp-nav">
                <a href="INDEX.HTML" class="nav-item active">
                    <img src="IMG/SHELL32.DLL/ICON16_1.ico" class="icon" alt="Home" />
                    <span>Home</span>
                </a>
                <a href="PROJECTS.HTML" class="nav-item active">
                    <img src="IMG/SHELL32.DLL/ICON9_1.ico" class="icon" alt="Projects" />
                    <span>Projects</span>
                </a>
                <a href="PHOTOS.HTML" class="nav-item active">
                    <img src="IMG/SHELL32.DLL/ICON317_1.ico" class="icon" alt="Photos" />
                    <span>Photos</span>
                </a>
                <a href="ABOUT.HTML" class="nav-item active">
                    <img src="IMG/SHELL32.DLL/ICON24_1.ico" class="icon" alt="About" />
                    <span>About</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- WINDOWS XP SCRIPTS INITIALIZATION -->
    <script>
        function updateDateTime() {
            const now = new Date();
            const currentDateTime = now.toLocaleString();
            const dtBox = document.querySelector("#datetime");
            if (dtBox) dtBox.textContent = currentDateTime;
        }

        setInterval(updateDateTime, 1000);
        
        function calculateExactTimeElapsed() {
            const timeBox = document.getElementById("time-elapsed");
            if (!timeBox) return;

            const pastDate = new Date("2009-06-18T18:30:00");
            const nowDate = new Date();

            let years = nowDate.getFullYear() - pastDate.getFullYear();

            const currentAnniversary = new Date(
                nowDate.getFullYear(), 
                pastDate.getMonth(), 
                pastDate.getDate(),
                pastDate.getHours(),
                pastDate.getMinutes()
            );
            if (nowDate < currentAnniversary) {
                years--;
            }

            const lastAnniversary = new Date(
                pastDate.getFullYear() + years, 
                pastDate.getMonth(), 
                pastDate.getDate(),
                pastDate.getHours(),
                pastDate.getMinutes()
            );

            let msDifference = nowDate - lastAnniversary;

            const msPerDay = 1000 * 60 * 60 * 24;
            const msPerHour = 1000 * 60 * 60;
            const msPerMinute = 1000 * 60;

            const days = Math.floor(msDifference / msPerDay);
            msDifference %= msPerDay; 

            const hours = Math.floor(msDifference / msPerHour);
            msDifference %= msPerHour; 

            const minutes = Math.floor(msDifference / msPerMinute);

            timeBox.innerHTML = `${years} years, ${days} days, ${hours} hours, and ${minutes} minutes`;
        }

        function initAgeTracker() {
            updateDateTime();
            calculateExactTimeElapsed();
            setInterval(calculateExactTimeElapsed, 60000);
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initAgeTracker);
        } else {
            initAgeTracker();
        }
    </script>

</body>
</html>
