                <script>
                    // create a function to update the date and time
                    function updateDateTime() {
                        // create a new `Date` object
                        const now = new Date();

                        // get the current date and time as a string
                        const currentDateTime = now.toLocaleString();

                        // update the `textContent` property of the `span` element with the `id` of `datetime`
                        document.querySelector("#datetime").textContent = currentDateTime;
                    }

                    // call the `updateDateTime` function every second
                    setInterval(updateDateTime, 1000);
                    
                    function calculateYearsAndDays() {
  const timeBox = document.getElementById("time-elapsed");
  if (!timeBox) return;

  const pastDate = new Date("2009-06-18T00:00:00");
  const nowDate = new Date();

  // 1. Calculate the rough difference in years
  let years = nowDate.getFullYear() - pastDate.getFullYear();

  // 2. Adjust years if the current date hasn't reached June 18th yet this year
  const currentAnniversary = new Date(nowDate.getFullYear(), pastDate.getMonth(), pastDate.getDate());
  if (nowDate < currentAnniversary) {
    years--;
  }

  // 3. Find the most recent anniversary date
  const lastAnniversary = new Date(pastDate.getFullYear() + years, pastDate.getMonth(), pastDate.getDate());

  // 4. Calculate the remaining days between the last anniversary and today
  const msDifference = nowDate - lastAnniversary;
  const days = Math.floor(msDifference / (1000 * 60 * 60 * 24));

  // 5. Output the result cleanly
  timeBox.innerHTML = `${years} years, ${days} days`;
}

// Safely initializes the script after your existing HTML finishes loading
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", calculateYearsAndDays);
} else {
  calculateYearsAndDays();
}

                </script>
            </h1>
