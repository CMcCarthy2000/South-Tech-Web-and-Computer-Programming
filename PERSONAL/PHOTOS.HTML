<!DOCTYPE html>
<html>
<head>
    <title>Photos</title>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="description" content="" />
    <meta name="keywords" content="" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
</head>
<body>

    <!-- 1. TOP BANNER: Real-time clock output -->
    <div class="TOP">
        <div class="top-content">
            The current time is&nbsp; <span id="datetime"></span>
        </div>
    </div>

    <!-- 2. MIDDLE AREA: Windows XP Filmstrip / Pictures Explorer Layout -->
    <div class="MIDDLE">
        <div class="explorer-container">
            
            <!-- Left Panel: Picture Tasks Sidebar (Page 5 & 42 Specs) -->
            <div class="left-pane">
                <div class="task-box">
                    <div class="task-header">Picture Tasks</div>
                    <div class="task-body">
                        <a href="#">View as a slide show</a>
                        <a href="#">Print pictures</a>
                        <a href="#">Set as background</a>
                    </div>
                </div>
                
                <div class="task-box secondary-box">
                    <div class="task-header">Other Places</div>
                    <div class="task-body">
                        <a href="INDEX.HTML">My Computer</a>
                        <a href="PROJECTS.HTML">My Projects</a>
                        <a href="ABOUT.HTML">My Documents</a>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Main Image Gallery Area -->
            <div class="right-pane picture-view-pane">
                <h1 class="folder-title">My Pictures</h1>
                
                <div class="gallery-grid">
                    
                    <!-- PHOTO CONTAINER PLACEHOLDER 1 -->
                    <div class="photo-thumbnail-card">
                        <div class="thumbnail-box">
                            <!-- Replace with your actual picture path later -->
                            <img src="IMG/SHELL32.DLL/ICON317_1.ico" class="gallery-img" alt="Thumbnail 1" />
                        </div>
                        <div class="photo-label">image_01.jpg</div>
                    </div>

                    <!-- PHOTO CONTAINER PLACEHOLDER 2 -->
                    <div class="photo-thumbnail-card">
                        <div class="thumbnail-box">
                            <img src="IMG/SHELL32.DLL/ICON317_1.ico" class="gallery-img" alt="Thumbnail 2" />
                        </div>
                        <div class="photo-label">image_02.jpg</div>
                    </div>

                    <!-- PHOTO CONTAINER PLACEHOLDER 3 -->
                    <div class="photo-thumbnail-card">
                        <div class="thumbnail-box">
                            <img src="IMG/SHELL32.DLL/ICON317_1.ico" class="gallery-img" alt="Thumbnail 3" />
                        </div>
                        <div class="photo-label">image_03.jpg</div>
                    </div>

                    <!-- PHOTO CONTAINER PLACEHOLDER 4 -->
                    <div class="photo-thumbnail-card">
                        <div class="thumbnail-box">
                            <img src="IMG/SHELL32.DLL/ICON317_1.ico" class="gallery-img" alt="Thumbnail 4" />
                        </div>
                        <div class="photo-label">image_04.jpg</div>
                    </div>

                </div>
            </div>
            
        </div>
    </div>

    <!-- 3. BOTTOM BANNER: System shortcuts row -->
    <div class="BOTTOM">
        <div class="bottom-content">
            <nav class="xp-nav">
                <a href="INDEX.HTML" class="nav-item active">
                    <img src="IMG/SHELL32.DLL/ICON16_1.ico" class="icon" alt="Home" />
                    <span>Home</span>
                </a>
                <a href="PROJECTS.HTML" class="nav-item active">
                    <img src="IMG/SHELL32.DLL/ICON9_1.ico" class="icon" alt="Projects" />
                    <span>Projects</span>
                </a>
                <a href="PHOTOS.HTML" class="nav-item active">
                    <img src="IMG/SHELL32.DLL/ICON317_1.ico" class="icon" alt="Photos" />
                    <span>Photos</span>
                </a>
                <a href="ABOUT.HTML" class="nav-item active">
                    <img src="IMG/SHELL32.DLL/ICON24_1.ico" class="icon" alt="About" />
                    <span>About</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- CLOCK CONTROLLER -->
    <script>
        function updateDateTime() {
            const now = new Date();
            const currentDateTime = now.toLocaleString();
            const dtBox = document.querySelector("#datetime");
            if (dtBox) dtBox.textContent = currentDateTime;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>

</body>
</html>
