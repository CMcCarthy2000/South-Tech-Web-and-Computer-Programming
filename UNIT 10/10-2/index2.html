<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #hover:hover {
            cursor: pointer;
            background-image: url('PLACEHOLDER.png');
        }
    </style>
    </head>
<body>
    <h1>hover picture change</h1>
    <p id="hover">Hover over the image to change it and look at the background. <br><br><br><br></p>
    <img src="PLACEHOLDER.png" alt="Image 1" width="500" onmouseover="this.src='image2.png';" onmouseout="this.src='PLACEHOLDER.png';">
</body>
</html>
