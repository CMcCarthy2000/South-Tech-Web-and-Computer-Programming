<!DOCTYPE html>
<html>
    <head>
        <title>more tables</title>
    </head>
    <style>
    table {
  border-collapse: collapse;
  width: 100%;
}

th, td {
  text-align: left;
  padding: 8px;
}

.black {
    background-color: black;
    color: white;
}
tr:nth-child(even) {background-color: #f2f2f2;}
    </style>
    <body>
        <table class="zebra">
            <tbody><tr>
                <th class="black">First Name</th>
                <th class="black">Last Name</th>
                <th class="black">Savings</th>
            </tr>
            <tr>
                <td>Peter</td>
                <td>Griffin</td>
                <td>$100</td>
            </tr>
            <tr>
                <td>Lois</td>
                <td>Griffin</td>
                <td>$150</td>
            </tr>
            <tr>
                <td>Joe</td>
                <td>Swanson</td>
                <td>$300</td>
            </tr>
            <tr>
                <td>Cleveland</td>
                <td>Brown</td>
                <td>$250</td>
            </tr>
        </tbody>
    </table>
    </body>
</html>
