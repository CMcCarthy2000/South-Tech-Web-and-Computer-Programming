<!DOCTYPE html>
<html>
    <head>
        <title>tables</title>
    </head>
    <style>
        table {
        border-collapse: collapse;
        border: 1px solid black;
        border: 1px solid;
        width: 50%;
        }

        th, td {
            padding: 5px 33px;
            border: 1px solid black;
        }

        .background {
            background-color: rgb(231, 230, 230);
        }
    </style>
    <body>
    <table>
        <caption>Life Expectancy By Current Age</caption>
        <tr>
            <th colspan="2" class="background">65</th>
            <th colspan="2" class="background">40</th>
            <th colspan="2" class="background">20</th>
        </tr>
        <tr>
            <th class="background">Men</th>
            <th class="background">Women</th>
            <th class="background">Men</th>
            <th class="background">Women</th>
            <th class="background">Men</th>
            <th class="background">Women</th>

        </tr>

        <tr>
            <td>82</td>
            <td>85</td>
            <td>78</td>
            <td>82</td>
            <td>77</td>
            <td>81</td>
        </tr>
    </table>
    </body>
</html>
