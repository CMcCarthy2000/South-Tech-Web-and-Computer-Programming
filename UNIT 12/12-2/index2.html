<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Survey</title>
        <style>
            * {
                font-family: Arial, Helvetica, sans-serif;
            }
            fieldset {
                border: 4px solid blue; 
            }

            h1, p {
                color: blue;
                font-weight: bold;
            }
            
            #submit, #reset {
                background-color: rgb(190, 190, 190);
                box-shadow: 2px 4px blue;
            }
        </style>
    </head>
    <body>
        <form>
            <fieldset>
                <h1>Gaming Information</h1>
                <p><label for="email">Enter name: </label> <input type="email" name="email" id="email" placeholder="Enter Email" required></p>
                <p><label for="fname">Enter password: </label> <input type="text" id="fname" name="fname" required></p>
                <p><label for="lname">Enter number of years gaming: </label> <input type="text" id="lname" name="lname" required></p>

             <p>
                <h2>Number of hours played weekly:</h2>
            <input type="radio" name="time" value="under5">&lt;5 hours a week<br>
            <input type="radio" name="time" value="5to10">5 to 10 hours a week<br>
            <input type="radio" name="time" value="morethan10">&gt;10 hours a week<br>
             </p>

                <!--Check boxes-->
                <h2>Gaming Console:</h2>

                <p><label for="web">Microsoft Xbox</label> <input type="checkbox" name="web" id="web" value="web"></p>
                <p><label for="facebook">Sony PlayStation 5</label> <input type="checkbox" name="facebook" id="facebook" value="facebook"></p>
                <p><label for="twitter">Nintendo Switch</label> <input type="checkbox" name="twitter" id="twitter" value="twitter"></p>
                <p><label for="emessage">Other</label> <input type="checkbox" name="emessage" id="emessage" value="emessage"></p>


                <input type="submit" id="submit" value="Submit">
                <input type="reset" id="reset" value="Reset">
            </fieldset>
        </form>
    </body>
</html>
