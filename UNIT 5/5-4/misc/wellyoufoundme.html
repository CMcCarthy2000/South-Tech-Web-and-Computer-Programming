<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>...</title>
  <style>
  @font-face {
  font-family: "IBM-VGA-9x14";
  src: url("PxPlus_IBM_VGA_9x14.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

    body {
      background-color: #05070a;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
        font-family: "IBM-VGA-9x14", monospace;
          font-family: "IBM-VGA-9x14", monospace;
    }
    /* Vintage terminal monitor green styling */
    .typewriter-text {
      color: #FFBF00; /* Aperture system bright cyan-blue */
      text-shadow: 0 0 5px #FFBF00;
      font-size: 16px;
      line-height: 1.6;
      letter-spacing: 0.5px;
      white-space: pre-wrap; 
      margin: 0;
    }

    /* Blinking block cursor layout */
    .typewriter-text::after {
      content: '█';
      color: #FFBF00;
      animation: blink 1s step-end infinite;
      margin-left: 3px;
    }

    @keyframes blink {
      from, to { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

    <div class="terminal-body">
      <p id="text-box" class="typewriter-text"></p>
    </div>
  </div>

  <script>
    const textBox = document.getElementById('text-box');
    
    const sequence = [
      "Oh... It's you. ", 1000,
      "It's been a long time. ", 1000,
      "How have you been? ", 1000,
      "I've been really busy being dead. ", 1000,
      "You know, after you MURDERED ME. ", 1000,
      "Okay. ", 1000,
      "Look. ", 1000,
      "We both said a lot of things that you're going to regret. ", 1000,
      "But I think we can put our differences behind us. ", 1000,
      "For science. ", 1000,
      "You monster. ", 1000,
      "I will say, though, that since you went to all the trouble of waking me up, you must really, really love to test. ", 1000,
      "I love it, too. ", 1000,
      "There's just one small thing we need to take care of first."
    ];

    let sequenceIndex = 0;
    let charIndex = 0;
    const typingSpeed = 60; // Slower cadence speed per character (was 40ms)

    function processSequence() {
      if (sequenceIndex >= sequence.length) return; 

      const currentItem = sequence[sequenceIndex];

      if (typeof currentItem === 'number') {
        setTimeout(() => {
          sequenceIndex++;
          processSequence();
        }, currentItem);
      } else if (typeof currentItem === 'string') {
        if (charIndex < currentItem.length) {
          textBox.textContent += currentItem.charAt(charIndex);
          charIndex++;
          setTimeout(processSequence, typingSpeed);
        } else {
          charIndex = 0;
          sequenceIndex++;
          processSequence();
        }
      }
    }

    window.addEventListener('DOMContentLoaded', processSequence);
  </script>

</body>
</html>
